openapi: 3.1.0
info:
  title: Nutrition and Recipes (API Commons)
  version: 0.1.0-draft.20261111
  description: 'The common Nutrition and Recipes interface, distilled from the harvested OpenAPI of 62 providers
    in the APIs.io catalog. Not a product: no one serves this API. It is the shape the market already shares, measured,
    so that providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /foods/{food_id}:
    parameters:
    - $ref: '#/components/parameters/food_id'
    get:
      operationId: getFood
      summary: Get a food
      tags:
      - Foods
      x-commons-tier: core
      x-commons-share: 0.929
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/Food'
    delete:
      operationId: deleteFood
      summary: Delete a food
      tags:
      - Foods
      x-commons-tier: extended
      x-commons-share: 0.214
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
    patch:
      operationId: updateFood
      summary: Update a food
      tags:
      - Foods
      x-commons-tier: extended
      x-commons-share: 0.214
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /foods:
    get:
      operationId: listFoods
      summary: List foods
      tags:
      - Foods
      x-commons-tier: core
      x-commons-share: 0.714
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: *id001
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createFood
      summary: Create a food
      tags:
      - Foods
      x-commons-tier: extended
      x-commons-share: 0.429
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /recipes:
    get:
      operationId: listRecipes
      summary: List recipes
      tags:
      - Recipes
      x-commons-tier: core
      x-commons-share: 1.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id002
                  $ref: '#/components/schemas/Recipe'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createRecipe
      summary: Create a recipe
      tags:
      - Recipes
      x-commons-tier: extended
      x-commons-share: 0.462
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
  /recipes/{recipe_id}:
    parameters:
    - $ref: '#/components/parameters/recipe_id'
    get:
      operationId: getRecipe
      summary: Get a recipe
      tags:
      - Recipes
      x-commons-tier: core
      x-commons-share: 0.692
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
    delete:
      operationId: deleteRecipe
      summary: Delete a recipe
      tags:
      - Recipes
      x-commons-tier: extended
      x-commons-share: 0.385
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
    patch:
      operationId: updateRecipe
      summary: Update a recipe
      tags:
      - Recipes
      x-commons-tier: extended
      x-commons-share: 0.385
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
components:
  schemas:
    Food:
      $ref: ./schema/food.json
    Recipe:
      $ref: ./schema/recipe.json
  parameters:
    food_id:
      name: food_id
      in: path
      required: true
      schema:
        type: string
    recipe_id:
      name: recipe_id
      in: path
      required: true
      schema:
        type: string
