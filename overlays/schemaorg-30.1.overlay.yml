overlay: 1.0.0
info:
  title: Nutrition and Recipes -- schemaorg-30.1 alignment
  version: 0.1.0-draft.20261111
  description: Marks the common Nutrition and Recipes OpenAPI with the schemaorg-30.1 object each schema corresponds to, and
    the field each property maps to. Generated by scripts/overlay.py from standards/schemaorg-30.1.yml; nothing is renamed.
extends: openapi.yml
actions:
- target: $.components.schemas.Food
  update:
    x-commons-standard:
      standard: schemaorg-30.1
      source: https://github.com/schemaorg/schemaorg/tree/v30.1
      objects:
      - NutritionInformation
      core_coverage: 0.5
      fields:
        serving_size: servingSize
        description: description
        name: name
      standard_only:
      - calories
      - carbohydrateContent
      - cholesterolContent
      - fatContent
      - fiberContent
      - proteinContent
      - saturatedFatContent
      - sodiumContent
      - sugarContent
      - transFatContent
      - unsaturatedFatContent
      - additionalType
      - alternateName
      - disambiguatingDescription
      - identifier
      - image
      - mainEntityOfPage
      - owner
      - potentialAction
      - sameAs
      - subjectOf
      - url
- target: $.components.schemas.Recipe
  update:
